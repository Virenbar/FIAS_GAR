name: Publish Artifact
on:
  workflow_dispatch:
jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-artifact.yml

  release:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build
    steps:
      - name: Version
        run: |
          echo "Artifact Version: ${{ needs.build.outputs.version }}"

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: List files
        run: ls -R

      - name: Archive artifacts
        run: |
          zip -r "FIASUpdate.zip" "FIASUpdate"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            FIASUpdate.zip
